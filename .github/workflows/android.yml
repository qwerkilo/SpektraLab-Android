name: Android checks and APK

on:
  # master is protected: every change is tested on its PR. Removing the master
  # push trigger avoids a second full run after every merge; dispatch manually
  # when a post-merge verification is genuinely needed.
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache the Gradle distribution
        id: gradle-dist
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-8.7
          key: gradle-8.7-bin

      - name: Provision Gradle
        if: steps.gradle-dist.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'gradle-8.7-bin.zip'
          $ok = $false
          for ($i = 1; $i -le 4 -and -not $ok; $i++) {
            & gh release download v8.7.0 --repo gradle/gradle-distributions `
              --pattern 'gradle-8.7-bin.zip' --output $zip --clobber
            if (Test-Path $zip) {
              Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
              if (Test-Path (Join-Path $env:RUNNER_TEMP 'gradle-8.7\bin\gradle.bat')) {
                $ok = $true
                break
              }
            }
            Write-Host "Gradle download attempt $i failed; retrying"
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw 'Gradle distribution download failed after 4 attempts' }

      - name: Add Gradle to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP 'gradle-8.7\bin')

      - name: Cache donor APK
        id: donor
        uses: actions/cache@v4
        with:
          path: app/build/SpektraLab-1.6.0e-qa.apk
          key: donor-SpektraLab-1.6.0e

      - name: Fetch the donor APK
        if: steps.donor.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path app\build | Out-Null
          $url = 'https://github.com/SAINTTaiYi/SpektraLab-Android/releases/download/v1.6.0e/SpektraLab-1.6.0e-arm64-v8a.apk'
          $out = 'app\build\SpektraLab-1.6.0e-qa.apk'
          $ok = $false
          for ($i = 1; $i -le 4 -and -not $ok; $i++) {
            & gh release download v1.6.0e --repo SAINTTaiYi/SpektraLab-Android `
              --pattern 'SpektraLab-1.6.0e-arm64-v8a.apk' --output $out --clobber
            if ((Test-Path $out) -and (Get-Item $out).Length -gt 10MB) {
              $ok = $true
              break
            }
            & curl.exe -fL --retry 3 --retry-all-errors --connect-timeout 20 -o $out $url
            if ((Test-Path $out) -and (Get-Item $out).Length -gt 10MB) {
              $ok = $true
            } else {
              Write-Host "donor download attempt $i failed; retrying"
              Start-Sleep -Seconds (5 * $i)
            }
          }
          if (-not $ok) {
            throw 'donor APK download failed after 4 attempts'
          }

      - name: Checks, lint and tests
        shell: pwsh
        run: |
          python app/build/check-manifest.py
          python app/build/test-gen-stock-catalog.py
          gradle checkstyleGovernance checkJvm lintDebug testDebugUnitTest --no-daemon

      - name: Release or CI signing key
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.SPK_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SPK_KS_PASS }}
          KEY_PASS: ${{ secrets.SPK_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.SPK_KEY_ALIAS }}
        run: |
          if ($env:KEYSTORE_B64) {
            $ks = Join-Path $env:RUNNER_TEMP 'release.jks'
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
            Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEYSTORE=$ks" -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value "SPK_KS_PASS=$env:KS_PASS" -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEY_PASS=$env:KEY_PASS" -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEY_ALIAS=$env:KEY_ALIAS" -Encoding utf8
            Write-Host 'Using the repository release keystore.'
          } else {
            $ks = Join-Path $env:RUNNER_TEMP 'ci.jks'
            & keytool -genkeypair -keystore $ks -storepass android -keypass android `
              -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=SpektraLab CI'
            Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEYSTORE=$ks" -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value "SPK_KS_PASS=android" -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEY_PASS=android" -Encoding utf8
            Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEY_ALIAS=ci" -Encoding utf8
            Write-Host 'No release keystore secret; using a CI-only key.'
          }

      - name: Assemble and gate the 16 KB APK
        shell: pwsh
        run: |
          gradle align16k --no-daemon

      - name: Verify the APK signature
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\build-tools\36.0.0\apksigner.bat" verify --print-certs `
            app/build/outputs/apk/debug/app-debug-16k-signed.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpektraLab-debug-16k
          path: app/build/outputs/apk/debug/app-debug-16k-signed.apk
          if-no-files-found: error
