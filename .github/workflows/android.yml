name: Android checks and APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Pure checks and lint
        shell: pwsh
        run: |
          python app/build/check-manifest.py
          python app/build/test-gen-stock-catalog.py
          .\gradlew.bat checkJvm lintDebug --no-daemon

      - name: Fetch the donor APK
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'SpektraLab-donor.apk'
          Invoke-WebRequest -Uri 'https://github.com/SAINTTaiYi/SpektraLab-Android/releases/download/v1.4.0/SpektraLab-1.4.0-arm64-v8a.apk' -OutFile $base
          Add-Content -Path $env:GITHUB_ENV -Value "BASE_APK=$base" -Encoding utf8

      - name: Signing key for CI
        shell: pwsh
        run: |
          $ks = Join-Path $env:RUNNER_TEMP 'ci.jks'
          & keytool -genkeypair -keystore $ks -storepass android -keypass android `
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=SpektraLab CI'
          Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEYSTORE=$ks" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "SPK_KS_PASS=android" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEY_PASS=android" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "SPK_KEY_ALIAS=ci" -Encoding utf8

      - name: Assemble and gate the 16 KB APK
        shell: pwsh
        run: |
          .\gradlew.bat align16k "-PbaseApk=$env:BASE_APK" --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpektraLab-debug-16k
          path: app/build/outputs/apk/debug/app-debug-16k-signed.apk
          if-no-files-found: error
