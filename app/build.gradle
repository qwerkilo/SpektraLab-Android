plugins {
    id 'com.android.application'
}

def userKeystore = System.getenv('SPK_KEYSTORE')

android {
    namespace 'app.spektralab'
    compileSdk 36

    defaultConfig {
        applicationId 'app.spektralab'
        minSdk 24
        targetSdk 36
        versionCode 155
        versionName '1.4.4-m3'
    }

    // Local builds use the user's release key when the environment provides
    // it; CI/clean checkouts fall back to the debug key.
    signingConfigs {
        if (userKeystore) {
            release {
                storeFile file(userKeystore)
                storePassword System.getenv('SPK_KS_PASS')
                keyAlias System.getenv('SPK_KEY_ALIAS')
                keyPassword System.getenv('SPK_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            if (userKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets', "$buildDir/generated/base/assets",
                               "$buildDir/generated/stockAssets"]
            jniLibs.srcDirs = ["$buildDir/generated/base/jniLibs"]
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.version']
        }
    }
}

configurations {
    checkJson
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    // The `*Check` classes run on the JVM, where android.jar's org.json is a
    // stub. The real reference implementation lets the Look JSON contract be
    // exercised as json, not as a hand-built map.
    checkJson 'org.json:json:20240303'
}

afterEvaluate {
    /**
     * The plain `*Check` classes are this project's pure seams. They no longer
     * compile with `javac -cp android.jar`, because the main sources now use
     * the AppCompat and Material libraries. Compile the checks against the
     * app's real debug classpath instead, then run each one from the repository
     * root so a check can read the theme resources it guards.
     */
    def debugCompile = tasks.named('compileDebugJavaWithJavac')

    def checkJvmCompile = tasks.register('checkJvmCompile', JavaCompile) {
        dependsOn debugCompile
        source = fileTree('src/test/java') { include '**/*.java' }
        classpath = files(configurations.checkJson,
                debugCompile.get().destinationDirectory,
                debugCompile.get().classpath)
        destinationDirectory = file("$buildDir/checkJvm/classes")
        sourceCompatibility = '17'
        targetCompatibility = '17'
        options.compilerArgs += ['-proc:none']
    }

    tasks.register('checkJvm') {
        dependsOn checkJvmCompile
        doLast {
            def runtime = files(configurations.checkJson,
                    "$buildDir/checkJvm/classes",
                    debugCompile.get().destinationDirectory, debugCompile.get().classpath)
            def java = new File(System.getProperty('java.home'), 'bin/java').absolutePath
            def checks = fileTree('src/test/java') { include '**/*Check.java' }.files
                    .collect { it.name.replaceFirst(/\.java$/, '') }.sort()
            checks.each { name ->
                exec {
                    workingDir rootProject.projectDir
                    commandLine java, '-cp', runtime.asPath, "app.spektralab.${name}"
                }
            }
        }
    }
}

/**
 * The native engine and the ~30 MB stock assets live in the shipped APK, not
 * in this checkout. Stage them into Gradle's generated source dirs so a Gradle
 * APK is installable without the Termux script. Override with -PbaseApk=<path>.
 */
def baseApk = file(project.findProperty('baseApk')
        ?: "$buildDir/SpektraLab-1.4.4-qa.apk")
def stagedBase = "$buildDir/generated/base"
def stockAssets = "$buildDir/generated/stockAssets"

tasks.register('stageBase') {
    inputs.file(baseApk)
    outputs.dir(stagedBase)
    doLast {
        if (!baseApk.isFile()) {
            throw new GradleException("Base APK not found: ${baseApk}. "
                    + "Build one first or pass -PbaseApk=<path>.")
        }
        delete stagedBase
        copy {
            from zipTree(baseApk)
            include 'assets/**'
            // The catalogue is regenerated from the profiles below, so a donor
            // APK from 1.3.4 cannot silently ship a catalogue without
            // targetPrint. Profiles and the rest of the assets stay staged.
            exclude 'assets/resources/stock_catalog.json'
            into "$stagedBase/assets"
            eachFile { it.path = it.path.replaceFirst('^assets/', '') }
        }
        copy {
            from zipTree(baseApk)
            include 'lib/arm64-v8a/*.so'
            into "$stagedBase/jniLibs/arm64-v8a"
            eachFile { it.path = it.name }
        }
    }
}

/**
 * The bundled catalogue is built from the profiles in the donor APK, not from
 * the donor's own catalogue. This is required for targetPrint and for the
 * spectral series to match the profiles actually shipped.
 */
tasks.register('generateStockCatalog') {
    dependsOn tasks.named('stageBase')
    def profiles = file("$stagedBase/assets/resources/profiles")
    def script = file('build/gen-stock-catalog.py')
    def catalog = file("$stockAssets/resources/stock_catalog.json")
    inputs.dir(profiles)
    inputs.file(script)
    outputs.file(catalog)
    doLast {
        if (!profiles.isDirectory()) {
            throw new GradleException("No stock profiles at ${profiles}; "
                    + "the base APK must carry assets/resources/profiles.")
        }
        exec {
            commandLine 'python', script.absolutePath,
                    '--profiles', profiles.absolutePath,
                    '--out', catalog.absolutePath
        }
    }
}

// Only packaging consumes the staged assets and native libraries. Keeping the
// staging out of preBuild lets a Java-only task (`checkJvm`) run without the
// donor APK.
tasks.matching { it.name == 'mergeDebugAssets' || it.name == 'mergeDebugJniLibFolders' }
        .configureEach { dependsOn tasks.named('stageBase') }
tasks.matching { it.name == 'mergeDebugAssets' }
        .configureEach { dependsOn tasks.named('generateStockCatalog') }
/**
 * Android 15/16 devices with 16 KB pages reject an APK whose uncompressed
 * libraries are only 4 KB aligned. AGP 8.2 does not add the extra zip
 * alignment, so produce a second, installable APK with build-tools 36.
 */
tasks.register('align16k') {
    dependsOn tasks.named('assembleDebug')
    doLast {
        def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
                ?: rootProject.file('local.properties').withInputStream {
                    Properties p = new Properties(); p.load(it); p.getProperty('sdk.dir')
                }
        def tools = file("${sdk}/build-tools/36.0.0")
        if (!tools.isDirectory()) {
            throw new GradleException("build-tools 36.0.0 not found at ${tools}")
        }
        def input = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        def aligned = file("${buildDir}/outputs/apk/debug/app-debug-16k.apk")
        def signed = file("${buildDir}/outputs/apk/debug/app-debug-16k-signed.apk")
        exec {
            commandLine "${tools}/zipalign.exe", '-P', '16', '-f', '4', input, aligned
        }
        def keystore = System.getenv('SPK_KEYSTORE')
        if (keystore) {
            exec {
                commandLine 'cmd', '/c', "${tools}\\apksigner.bat", 'sign',
                        '--ks', keystore,
                        '--ks-pass', 'env:SPK_KS_PASS',
                        '--key-pass', 'env:SPK_KEY_PASS',
                        '--ks-key-alias', System.getenv('SPK_KEY_ALIAS'),
                        '--out', signed, aligned
            }
            logger.lifecycle("16 KB APK: ${signed}")
        } else {
            logger.lifecycle("16 KB APK (unsigned): ${aligned}")
        }
        def checkedApk = keystore ? signed : aligned
        exec {
            commandLine 'python', file('build/check-apk.py').absolutePath,
                    checkedApk.absolutePath
        }
    }
}
